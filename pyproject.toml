[project]
name = "gme"
version = "0.1.0"
description = "Growth & Maintenance Engine: markets and maintains a portfolio of consumer apps"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
voice = ["elevenlabs>=2.80", "python-dotenv>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gme"]
